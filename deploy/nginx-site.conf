# 将本文件复制到 Nginx 的 conf.d 目录前，请修改 server_name 和 root。
# 示例：/etc/nginx/conf.d/club-registration.conf

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;

    # 修改为服务器上 corepack pnpm run build 生成的 dist 目录。
    root /var/www/club-registration/dist;
    index index.html;

    # 页面资源启用 gzip，降低 40M 带宽下的首屏传输量。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Vite 生成的文件名带内容 hash，可长期缓存。
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html 不缓存，避免发布新版本后用户继续拿到旧入口文件。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # API 交给本机 Node 服务，Nginx 负责连接复用和超时保护。
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;
    }

    # 管理员导入文件最大 5MB，这里留少量请求体余量。
    client_max_body_size 10m;

    # Vue Router history 模式：未知前端路径回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
