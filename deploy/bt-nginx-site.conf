# 宝塔面板 Nginx 配置（适配版）
# 使用方式：宝塔面板 → 网站 → 你的站点 → 设置 → 配置文件 → 粘贴覆盖
# 前提：
#   1. 在服务器执行 `corepack pnpm run build` 生成 dist
#   2. 将 dist 上传到站点目录（或构建后 dist 已在站点目录内）
#   3. Node 服务监听 127.0.0.1:3001（PM2 启动）
#
# 保留宝塔的 SSL、HTTP 强制跳转等设置不动，只替换以下 server 块内容。

server {
    listen 80;
    listen [::]:80;
    server_name club.whysss.cn;

    # 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name club.whysss.cn;

    # ===== SSL 证书（宝塔自动签发/上传）=====
    # 以下两行需要替换为宝塔实际生成的证书路径，
    # 或在宝塔面板中直接使用“SSL”菜单配置后自动填充。
    ssl_certificate /www/server/panel/vhost/cert/club.whysss.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/club.whysss.cn/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ===== 站点根目录：dist 构建产物（关键：静态文件交给 Nginx）=====
    # 注意：按服务器实际项目目录修改！本模板按 /www/wwwroot/club-registration 编写
    root /www/wwwroot/club-registration/dist;
    index index.html;

    # ===== 请求体限制（学生导入文件上限 5MB，留余量）=====
    client_max_body_size 10m;

    # ===== 页面资源 gzip =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ===== 静态资源：文件名带内容 hash，缓存一年 =====
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ===== index.html 不缓存 =====
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ===== API 反向代理到 Node（PM2 多进程监听 127.0.0.1:3001）=====
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;
    }

    # ===== 健康检查 =====
    location = /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ===== SPA 路由回退 =====
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 宝塔默认的 PHP/防跨站等 include 如需保留可自行追加
    # include enable-php-00.conf;
    # include /www/server/panel/vhost/rewrite/club.whysss.cn.conf;
}
